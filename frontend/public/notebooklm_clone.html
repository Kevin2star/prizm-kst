<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Clone - Full Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        bgMain: '#1e1e1e',
                        bgHeader: '#2a2a2a',
                        bgPanel: '#252525',
                        bgInput: '#171717',
                        borderMain: '#333333',
                        textMain: '#e0e0e0',
                        textMuted: '#888888',
                        primary: '#60a5fa'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            margin: 0;
            overflow: hidden; /* Prevent page scrolling */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        /* Resizer styles */
        .resizer {
            width: 8px;
            cursor: col-resize;
            background-color: #252525;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            z-index: 50;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }
        .resizer::after {
            content: '';
            width: 2px;
            height: 24px;
            background-color: #555;
            border-radius: 2px;
        }
        .resizer:hover, .resizer.resizing { background-color: #333; }
        .resizer:hover::after, .resizer.resizing::after { background-color: #60a5fa; }

        /* D3 Mind Map Styles */
        .node rect {
            fill: #252525;
            stroke-width: 2px;
            transition: fill 0.2s, stroke 0.3s ease;
        }
        .node rect:hover { fill: #333; cursor: pointer; }
        .node text {
            font-size: 13px;
            fill: #e0e0e0;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }
        .link {
            fill: none;
            stroke-width: 2px;
            opacity: 0.8;
            transition: stroke 0.3s ease;
        }
        
        /* Member Profile Active State */
        .member-profile {
            transition: all 0.2s ease;
            opacity: 0.5;
            border: 2px solid transparent;
        }
        .member-profile.active {
            opacity: 1;
            transform: scale(1.1);
            border-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Loader animation */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen flex flex-col text-sm antialiased">

    <!-- Top Header -->
    <header class="h-14 bg-bgHeader border-b border-borderMain flex items-center justify-between px-4 shrink-0 shadow-sm z-30 relative">
        <!-- Left: Logo & Project Name -->
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-bgMain shadow-sm">
                <i class="fa-solid fa-layer-group text-sm"></i>
            </div>
            <span class="font-semibold text-base text-textMain tracking-wide">Project Name</span>
        </div>
        
        <!-- Right: Actions & Profile -->
        <div class="flex items-center gap-4">
            <button class="flex items-center gap-2 text-textMuted hover:text-textMain transition px-2 py-1 rounded hover:bg-borderMain">
                <i class="fa-solid fa-share-nodes"></i> <span>공유</span>
            </button>
            <button class="flex items-center gap-2 text-textMuted hover:text-textMain transition px-2 py-1 rounded hover:bg-borderMain">
                <i class="fa-solid fa-gear"></i> <span>설정</span>
            </button>
            <div class="w-8 h-8 rounded-full bg-gray-600 border-2 border-borderMain flex items-center justify-center overflow-hidden cursor-pointer shadow-sm ml-2">
                <i class="fa-solid fa-user text-xs text-gray-300"></i>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden relative bg-bgMain" id="workspace">
        
        <!-- Fixed Sidebar (Team Profiles) -->
        <aside class="w-[72px] min-w-[72px] bg-bgPanel border-r border-borderMain flex flex-col items-center justify-end py-6 shrink-0 z-20 shadow-[2px_0_10px_rgba(0,0,0,0.2)]">
            <div class="flex flex-col items-center gap-3 w-full">
                <!-- Stacked bottom to top using flex-col-reverse -->
                <div id="team-members-container" class="flex flex-col-reverse gap-3 w-full items-center">
                    <!-- Profiles dynamically injected here -->
                </div>
                <div class="h-[1px] w-8 bg-borderMain my-1"></div>
                <span class="text-[10px] font-bold text-textMuted uppercase tracking-widest">team</span>
            </div>
        </aside>

        <!-- Pane 1: Team Chat (Ratio 1) -->
        <section id="col-teamchat" style="width: 20%; min-width: 200px;" class="flex flex-col h-full bg-bgPanel shrink-0">
            <div class="h-12 border-b border-borderMain flex items-center px-4 shrink-0 bg-bgPanel">
                <h2 class="font-bold text-textMain text-sm flex items-center gap-2">
                    <i class="fa-solid fa-users text-textMuted"></i> 팀 채팅
                </h2>
            </div>
            
            <div id="team-chat-history" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                <div class="flex flex-col gap-1 items-start">
                    <div class="text-[11px] text-textMuted mb-0.5 ml-1 text-[#f59e0b]">박가희</div>
                    <div class="bg-bgInput border border-borderMain p-2.5 rounded-xl rounded-tl-sm text-textMain text-xs leading-relaxed max-w-[90%]">
                        새로운 프로젝트 레이아웃 공유드립니다. 확인해주세요!
                    </div>
                </div>
            </div>

            <div class="border-t border-borderMain p-3 bg-bgPanel shrink-0">
                <div class="relative flex items-center">
                    <textarea id="team-chat-input" rows="1" class="w-full bg-bgInput border border-borderMain rounded-lg text-textMain text-xs py-2.5 pl-3 pr-10 focus:outline-none focus:border-primary resize-none" placeholder="팀원에게 메시지..."></textarea>
                    <button id="team-send-btn" class="absolute right-2 text-textMuted hover:text-primary transition p-1">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Resizer 1 -->
        <div class="resizer" id="resizer-1"></div>

        <!-- Pane 2: AI Chat (Ratio 1) -->
        <section id="col-aichat" style="width: 20%; min-width: 200px;" class="flex flex-col h-full bg-bgMain shrink-0">
            <div class="h-12 border-b border-borderMain flex items-center px-4 shrink-0 bg-bgMain">
                <h2 class="font-bold text-textMain text-sm flex items-center gap-2">
                    <i class="fa-solid fa-robot text-primary"></i> AI 채팅
                </h2>
            </div>
            
            <div id="ai-chat-history" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                <div class="flex flex-col gap-1 items-start">
                    <div class="text-[11px] text-textMuted mb-0.5 ml-1">AI Assistant</div>
                    <div class="bg-bgPanel border border-borderMain p-2.5 rounded-xl rounded-tl-sm text-textMain text-xs leading-relaxed max-w-[95%]">
                        자료의 내용을 입력하시면 분석하여 마인드맵에 자동으로 공통점/차이점 등을 분류해 드립니다.
                    </div>
                </div>
            </div>

            <div class="border-t border-borderMain p-3 bg-bgMain shrink-0">
                <div class="relative flex items-center">
                    <textarea id="ai-chat-input" rows="1" class="w-full bg-bgInput border border-borderMain rounded-lg text-textMain text-xs py-2.5 pl-3 pr-10 focus:outline-none focus:border-primary resize-none" placeholder="AI 분석 요청..."></textarea>
                    <button id="ai-send-btn" class="absolute right-2 text-textMuted hover:text-primary transition p-1">
                        <i class="fa-solid fa-play text-sm"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Resizer 2 -->
        <div class="resizer" id="resizer-2"></div>

        <!-- Pane 3: Mind Map (Ratio 3) -->
        <section id="col-mindmap" style="width: 60%; min-width: 300px;" class="flex flex-col h-full bg-bgPanel relative shrink-0">
            <div class="h-12 flex items-center justify-between px-5 shrink-0 bg-bgPanel z-10 absolute top-0 w-full left-0 border-b border-borderMain backdrop-blur-sm bg-opacity-90">
                <h2 class="font-bold text-textMain text-sm flex items-center gap-2">
                    <i class="fa-solid fa-network-wired text-textMuted"></i> 마인드 맵
                </h2>
                <div class="flex gap-2">
                    <button id="zoom-in" class="w-7 h-7 rounded bg-bgInput border border-borderMain hover:bg-borderMain text-textMuted hover:text-white transition flex items-center justify-center"><i class="fa-solid fa-plus text-[10px]"></i></button>
                    <button id="zoom-out" class="w-7 h-7 rounded bg-bgInput border border-borderMain hover:bg-borderMain text-textMuted hover:text-white transition flex items-center justify-center"><i class="fa-solid fa-minus text-[10px]"></i></button>
                    <button id="zoom-fit" class="w-7 h-7 rounded bg-bgInput border border-borderMain hover:bg-borderMain text-textMuted hover:text-white transition flex items-center justify-center"><i class="fa-solid fa-expand text-[10px]"></i></button>
                </div>
            </div>

            <!-- D3 Chart Container -->
            <div class="flex-1 w-full h-full relative mt-12" id="d3-container"></div>
        </section>

    </main>

    <script>
        // --- State Management ---
        const teamMembers = [
            { id: 'm1', name: '박가희', color: '#f59e0b' }, // Amber
            { id: 'm2', name: '김명석', color: '#3b82f6' }, // Blue
            { id: 'm3', name: '이민수', color: '#10b981' }  // Green
        ];
        
        // Simulating the logged in/active member
        let activeMemberId = 'm1'; 

        // --- Initialize Team Members UI ---
        const membersContainer = document.getElementById('team-members-container');
        
        function renderMembers() {
            membersContainer.innerHTML = '';
            
            // Render members (stacked bottom up due to flex-col-reverse)
            teamMembers.forEach(member => {
                const isActive = member.id === activeMemberId;
                const el = document.createElement('div');
                
                el.className = `member-profile w-10 h-10 rounded-full flex items-center justify-center text-[10px] font-bold text-bgMain cursor-pointer shrink-0 shadow-md ${isActive ? 'active' : ''}`;
                el.style.backgroundColor = member.color;
                
                // Truncate name
                const shortName = member.name.length > 3 ? member.name.substring(0,3) : member.name;
                el.textContent = shortName;
                el.title = member.name;

                el.onclick = () => {
                    activeMemberId = member.id;
                    renderMembers(); // Re-render to show active state
                };

                membersContainer.appendChild(el);
            });
        }
        renderMembers();

        function getActiveMemberColor() {
            return teamMembers.find(m => m.id === activeMemberId)?.color || '#e0e0e0';
        }

        function getActiveMemberName() {
            return teamMembers.find(m => m.id === activeMemberId)?.name || 'User';
        }

        // --- Panel Resizing Logic ---
        function initResizers() {
            const workspace = document.getElementById('workspace');
            const colTeam = document.getElementById('col-teamchat');
            const colAI = document.getElementById('col-aichat');
            const colMindmap = document.getElementById('col-mindmap');
            const sidebarWidth = 72; // Fixed sidebar width
            
            function setupResizer(resizerId, leftCol, rightCol) {
                const resizer = document.getElementById(resizerId);
                let isResizing = false;
                let startX = 0;
                let startLeftWidth = 0;
                let startRightWidth = 0;

                resizer.addEventListener('mousedown', function(e) {
                    isResizing = true;
                    startX = e.clientX;
                    startLeftWidth = leftCol.getBoundingClientRect().width;
                    startRightWidth = rightCol.getBoundingClientRect().width;

                    resizer.classList.add('resizing');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';

                    document.addEventListener('mousemove', mouseMoveHandler);
                    document.addEventListener('mouseup', mouseUpHandler);
                });

                const mouseMoveHandler = function(e) {
                    if (!isResizing) return;
                    const dx = e.clientX - startX;
                    
                    // The available width for the 3 columns is workspace width minus sidebar width
                    const availableWidth = workspace.getBoundingClientRect().width - sidebarWidth;
                    
                    const newLeftWidth = startLeftWidth + dx;
                    const newRightWidth = startRightWidth - dx;

                    // Apply min-widths based on CSS definitions
                    if (newLeftWidth < 200 || newRightWidth < (rightCol === colMindmap ? 300 : 200)) return;

                    const leftPercent = (newLeftWidth / availableWidth) * 100;
                    const rightPercent = (newRightWidth / availableWidth) * 100;

                    leftCol.style.width = `${leftPercent}%`;
                    rightCol.style.width = `${rightPercent}%`;
                };

                const mouseUpHandler = function() {
                    isResizing = false;
                    resizer.classList.remove('resizing');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    document.removeEventListener('mousemove', mouseMoveHandler);
                    document.removeEventListener('mouseup', mouseUpHandler);
                };
            }

            setupResizer('resizer-1', colTeam, colAI);
            setupResizer('resizer-2', colAI, colMindmap);
        }
        initResizers();

        // --- D3.js Visualization Logic ---
        const defaultBorderColor = '#555555';
        
        let treeData = {
            id: 'root',
            name: "문서 분석",
            color: defaultBorderColor,
            children: [
                { id: 'c1', name: "공통점", color: defaultBorderColor, children: [] },
                { id: 'c2', name: "차이점", color: defaultBorderColor, children: [] },
                { id: 'c3', name: "비고", color: defaultBorderColor, children: [] }
            ]
        };

        const d3Container = document.getElementById('d3-container');
        let width = d3Container.clientWidth;
        let height = d3Container.clientHeight;
        
        const svg = d3.select("#d3-container")
            .append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .attr("viewBox", `0 0 ${width} ${height}`);

        const g = svg.append("g");

        // Zoom Behavior
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => g.attr("transform", event.transform));

        svg.call(zoom);

        // Center the initial view
        function centerTree() {
            const initialTransform = d3.zoomIdentity.translate(width / 6, height / 2.5).scale(1);
            svg.transition().duration(500).call(zoom.transform, initialTransform);
        }
        // Delay slightly so layout calculates correctly on first load
        setTimeout(centerTree, 100);

        d3.select("#zoom-in").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 1.3));
        d3.select("#zoom-out").on("click", () => svg.transition().duration(300).call(zoom.scaleBy, 0.7));
        d3.select("#zoom-fit").on("click", centerTree);

        const treeLayout = d3.tree().nodeSize([50, 200]); // Vertical spacing, Horizontal spacing

        function updateChart(sourceData) {
            const root = d3.hierarchy(sourceData);
            treeLayout(root);

            const nodes = root.descendants();
            const links = root.links();

            // LINKS
            const linkSelection = g.selectAll(".link")
                .data(links, d => d.target.data.id);

            const linkEnter = linkSelection.enter()
                .insert("path", "g")
                .attr("class", "link")
                .attr("d", d => {
                    const o = {x: d.source.x, y: d.source.y};
                    return d3.linkHorizontal().x(l => l.y).y(l => l.x)({source: o, target: o});
                })
                .style("stroke", d => d.target.data.color || defaultBorderColor)
                .style("opacity", 0);

            const linkUpdate = linkEnter.merge(linkSelection);
            
            linkUpdate.transition().duration(500)
                .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x))
                .style("opacity", 0.8)
                .style("stroke", d => d.target.data.color || defaultBorderColor); 

            linkSelection.exit().transition().duration(500).style("opacity", 0).remove();

            // NODES
            const nodeSelection = g.selectAll(".node")
                .data(nodes, d => d.data.id);

            const nodeEnter = nodeSelection.enter()
                .append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.parent ? d.parent.y : d.y},${d.parent ? d.parent.x : d.x})`)
                .style("opacity", 0);

            nodeEnter.append("rect")
                .attr("rx", 6)
                .attr("ry", 6)
                .attr("y", -16)
                .attr("height", 32)
                .style("stroke", d => d.data.color || defaultBorderColor);

            nodeEnter.append("text")
                .attr("dy", "0.35em")
                .text(d => d.data.name);

            const nodeUpdate = nodeEnter.merge(nodeSelection);

            nodeUpdate.transition().duration(500)
                .attr("transform", d => `translate(${d.y},${d.x})`)
                .style("opacity", 1);

            // Dynamic rect width based on text length
            nodeUpdate.select("rect").each(function(d) {
                const textNode = this.parentNode.querySelector('text');
                const textWidth = textNode.getComputedTextLength();
                const rectWidth = textWidth + 24;
                
                d3.select(this)
                  .transition().duration(500)
                  .attr("width", rectWidth)
                  .attr("x", (d.children || d._children) ? -(rectWidth) : 0)
                  .style("stroke", d.data.color || defaultBorderColor);
            });

            nodeUpdate.select("text").each(function(d) {
                d3.select(this)
                  .transition().duration(500)
                  .attr("x", (d.children || d._children) ? -12 : 12)
                  .attr("text-anchor", (d.children || d._children) ? "end" : "start");
            });

            nodeSelection.exit().transition().duration(500)
                .attr("transform", d => `translate(${d.parent ? d.parent.y : d.y},${d.parent ? d.parent.x : d.x})`)
                .style("opacity", 0).remove();
        }

        updateChart(treeData);

        // Resize observer to keep SVG responsive
        const resizeObserver = new ResizeObserver(entries => {
            window.requestAnimationFrame(() => {
                if (!Array.isArray(entries) || !entries.length) return;
                for (let entry of entries) {
                    width = entry.contentRect.width;
                    height = entry.contentRect.height;
                    svg.attr("viewBox", `0 0 ${width} ${height}`);
                }
            });
        });
        resizeObserver.observe(d3Container);

        // --- Chat Interactions ---
        const teamChatHistory = document.getElementById('team-chat-history');
        const teamChatInput = document.getElementById('team-chat-input');
        const teamSendBtn = document.getElementById('team-send-btn');

        const aiChatHistory = document.getElementById('ai-chat-history');
        const aiChatInput = document.getElementById('ai-chat-input');
        const aiSendBtn = document.getElementById('ai-send-btn');

        function appendMessage(container, name, text, color, isRightAligned = false, isAI = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col gap-1 ${isRightAligned ? 'items-end' : 'items-start'}`;
            
            const label = document.createElement('div');
            label.className = `text-[11px] mb-0.5 ${isRightAligned ? 'mr-1' : 'ml-1'}`;
            label.style.color = isAI ? '#888' : color;
            label.textContent = name;
            
            const bubble = document.createElement('div');
            bubble.className = `p-2.5 rounded-xl text-textMain text-xs leading-relaxed max-w-[95%] border ${
                isRightAligned 
                ? 'bg-[#2a2a2a] border-[#444] rounded-tr-sm text-left' 
                : 'bg-bgPanel border-borderMain rounded-tl-sm'
            }`;
            bubble.innerText = text;

            msgDiv.appendChild(label);
            msgDiv.appendChild(bubble);
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Logic for AI creating a node
        function addMindMapNode(text, colorCode) {
            // Categorize randomly into 공통점, 차이점, or 비고 for demo purposes
            const categories = treeData.children;
            const targetCategory = categories[Math.floor(Math.random() * categories.length)];
            
            const shortText = text.length > 15 ? text.substring(0, 15) + "..." : text;
            
            targetCategory.children.push({
                id: 'node-' + Math.random().toString(36).substr(2, 9),
                name: shortText,
                color: colorCode
            });
            
            updateChart(treeData);
        }

        function handleAIInput() {
            const text = aiChatInput.value.trim();
            if (!text) return;

            const currentColor = getActiveMemberColor();
            const currentName = getActiveMemberName();

            // 1. User Message to AI
            appendMessage(aiChatHistory, currentName, text, currentColor, true);
            aiChatInput.value = '';

            // 2. Typing Indicator
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'ai-typing';
            indicatorDiv.className = 'flex flex-col gap-1 items-start mt-2';
            indicatorDiv.innerHTML = `
                <div class="text-[11px] text-textMuted mb-0.5 ml-1">AI Assistant</div>
                <div class="bg-bgPanel border border-borderMain p-3 py-3.5 rounded-xl rounded-tl-sm flex items-center">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            `;
            aiChatHistory.appendChild(indicatorDiv);
            aiChatHistory.scrollTop = aiChatHistory.scrollHeight;

            // 3. Simulated AI Response & Node Creation
            setTimeout(() => {
                const ind = document.getElementById('ai-typing');
                if(ind) ind.remove();

                const responseText = `'${text}'에 대한 내용을 분석하여 카테고리에 할당했습니다.`;
                appendMessage(aiChatHistory, 'AI Assistant', responseText, '#888', false, true);

                addMindMapNode(text, currentColor);

            }, 800);
        }

        aiSendBtn.addEventListener('click', handleAIInput);
        aiChatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleAIInput();
            }
        });

        // Team Chat Input Logic
        function handleTeamInput() {
            const text = teamChatInput.value.trim();
            if(!text) return;

            const currentColor = getActiveMemberColor();
            const currentName = getActiveMemberName();

            appendMessage(teamChatHistory, currentName, text, currentColor, true);
            teamChatInput.value = '';
        }

        teamSendBtn.addEventListener('click', handleTeamInput);
        teamChatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleTeamInput();
            }
        });

    </script>
</body>
</html>
